<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Principais grupos funcionais organicos</title>
  <desc id="desc">Quadro visual com exemplos simplificados de hidrocarboneto, alcool, aldeido, cetona, acido carboxilico, ester, eter, amina e amida.</desc>
  <rect width="900" height="470" fill="#f7fbff"/>
  <rect x="24" y="22" width="852" height="60" rx="10" fill="#123047"/>
  <text x="450" y="58" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Funcoes Organicas - Grupos Funcionais</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#22313f">
    <g transform="translate(40 110)">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#b8c7d6"/>
      <text x="18" y="28" font-weight="700" fill="#087451">Hidrocarboneto</text>
      <text x="18" y="58">C - H</text>
      <text x="18" y="78" font-size="13" fill="#667586">Somente carbono e hidrogenio</text>
    </g>
    <g transform="translate(325 110)">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#b8c7d6"/>
      <text x="18" y="28" font-weight="700" fill="#087451">Alcool</text>
      <text x="18" y="58">R - OH</text>
      <text x="18" y="78" font-size="13" fill="#667586">Possui grupo hidroxila</text>
    </g>
    <g transform="translate(610 110)">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#b8c7d6"/>
      <text x="18" y="28" font-weight="700" fill="#087451">Aldeido</text>
      <text x="18" y="58">R - CHO</text>
      <text x="18" y="78" font-size="13" fill="#667586">Possui grupo -CHO</text>
    </g>

    <g transform="translate(40 225)">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#b8c7d6"/>
      <text x="18" y="28" font-weight="700" fill="#087451">Cetona</text>
      <text x="18" y="58">R - CO - R</text>
      <text x="18" y="78" font-size="13" fill="#667586">Carbonila entre carbonos</text>
    </g>
    <g transform="translate(325 225)">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#b8c7d6"/>
      <text x="18" y="28" font-weight="700" fill="#087451">Acido carboxilico</text>
      <text x="18" y="58">R - COOH</text>
      <text x="18" y="78" font-size="13" fill="#667586">Possui grupo carboxila</text>
    </g>
    <g transform="translate(610 225)">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#b8c7d6"/>
      <text x="18" y="28" font-weight="700" fill="#087451">Ester</text>
      <text x="18" y="58">R - COO - R</text>
      <text x="18" y="78" font-size="13" fill="#667586">Derivado de acido carboxilico</text>
    </g>

    <g transform="translate(40 340)">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#b8c7d6"/>
      <text x="18" y="28" font-weight="700" fill="#087451">Eter</text>
      <text x="18" y="58">R - O - R</text>
      <text x="18" y="78" font-size="13" fill="#667586">Oxigenio entre cadeias</text>
    </g>
    <g transform="translate(325 340)">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#b8c7d6"/>
      <text x="18" y="28" font-weight="700" fill="#087451">Amina</text>
      <text x="18" y="58">R - NH2</text>
      <text x="18" y="78" font-size="13" fill="#667586">Funcao nitrogenada</text>
    </g>
    <g transform="translate(610 340)">
      <rect width="250" height="90" rx="8" fill="#ffffff" stroke="#b8c7d6"/>
      <text x="18" y="28" font-weight="700" fill="#087451">Amida</text>
      <text x="18" y="58">R - CONH2</text>
      <text x="18" y="78" font-size="13" fill="#667586">Possui carbonila e nitrogenio</text>
    </g>
  </g>
</svg>
